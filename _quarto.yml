project:
  type: website
  output-dir: docs          # GitHub Pages serves this folder
  render:
    - index.qmd
    - notebooks/*.qmd

website:
  title: "YouBike 電輔車與一般車使用差異"
  navbar:
    left:
      - href: index.qmd
        text: 首頁
      - href: notebooks/01_data_prep.qmd
        text: 資料整理
      - href: notebooks/02_trip_level.qmd
        text: 旅次分析
